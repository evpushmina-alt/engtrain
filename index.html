<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Trainer — Любые слова | Перевод + примеры</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
        }
        body {
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            padding: 24px 28px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
        }
        h1 { font-size: 1.9rem; margin: 0 0 6px 0; color: #0f2b3d; }
        .sub { color: #2c5a6e; border-left: 4px solid #3b82f6; padding-left: 16px; margin-bottom: 24px; }
        .mode-tabs { display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        .mode-btn { background: none; border: none; font-size: 1rem; font-weight: 600; padding: 8px 24px; border-radius: 40px; cursor: pointer; color: #1e293b; }
        .mode-btn.active { background: #3b82f6; color: white; }
        .panel { display: none; margin-bottom: 30px; }
        .panel.active { display: block; }
        label { font-weight: 600; display: block; margin-top: 14px; margin-bottom: 6px; color: #0c4a6e; }
        textarea, select, input { width: 100%; padding: 12px; border-radius: 16px; border: 1px solid #cbd5e1; font-size: 0.95rem; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; font-weight: 600; border-radius: 40px; cursor: pointer; margin-top: 12px; }
        button:hover { background: #2563eb; }
        .word-badge { background: #e0f2fe; padding: 6px 16px; border-radius: 40px; display: inline-block; margin: 5px 8px 5px 0; }
        .words-bar { background: #f8fafc; border-radius: 24px; padding: 14px; margin: 16px 0; }
        .exercise-card { background: #ffffff; border-radius: 24px; padding: 18px 22px; margin-bottom: 28px; border: 1px solid #eef2ff; }
        .exercise-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 16px; color: #1e3a8a; }
        .context-item, .trans-item, .cloze-item { background: #f9f9ff; margin: 14px 0; padding: 14px; border-radius: 20px; }
        .match-area { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 24px; }
        .match-col { flex: 1; background: #f1f5f9; border-radius: 20px; padding: 12px; }
        .match-word { background: white; padding: 12px; margin: 8px 0; border-radius: 60px; cursor: pointer; text-align: center; border: 1px solid #cbd5e1; }
        .match-word.selected { background: #bbf0ff; border-color: #3b82f6; box-shadow: 0 0 0 2px #3b82f6; }
        .feedback-good { color: #15803d; font-weight: bold; }
        .feedback-bad { color: #b91c1c; font-weight: bold; }
        hr { margin: 20px 0; }
        .flex-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .loading { color: #3b82f6; font-style: italic; }
    </style>
</head>
<body>
<div class="container">
    <h1>📘 English Trainer</h1>
    <div class="sub">Любые слова — автоматический перевод и примеры</div>

    <div class="mode-tabs">
        <button class="mode-btn active" data-mode="manual">✍️ Ввести слова вручную</button>
        <button class="mode-btn" data-mode="text">📄 Из текста (скрипт)</button>
    </div>

    <!-- Ручной ввод -->
    <div id="panel-manual" class="panel active">
        <label>Введите слова через запятую или пробел (английские)</label>
        <textarea id="custom-words-list" rows="3" placeholder="например: ubiquitous, resilience, cat, meditation, money"></textarea>
        <button id="use-manual-btn">✅ Использовать эти слова</button>
    </div>

    <!-- Из текста -->
    <div id="panel-text" class="panel">
        <label>Вставьте текст на английском</label>
        <textarea id="source-text" rows="5" placeholder="Вставьте текст..."></textarea>
        <label>Уровень (если нужен):</label>
        <select id="level-choice">
            <option value="A1">A1</option><option value="A2">A2</option><option value="B1">B1</option>
            <option value="B2">B2</option><option value="C1" selected>C1</option><option value="C2">C2</option>
        </select>
        <button id="extract-words-btn">🔍 Извлечь слова уровня</button>
    </div>

    <div id="words-block" style="display: none;">
        <div class="words-bar">
            <div><strong>📌 Ваши слова:</strong></div>
            <div id="display-word-badges"></div>
            <div class="flex-row">
                <label style="margin:0">Количество слов:</label>
                <select id="word-count-select" style="width: auto;"></select>
                <button id="confirm-count-btn">✅ Подтвердить и начать упражнения</button>
            </div>
        </div>
    </div>
    <div id="exercises-area"></div>
</div>

<script>
// ------------------- ФУНКЦИИ ПОЛУЧЕНИЯ ПЕРЕВОДА И ПРИМЕРОВ (БЕСПЛАТНО) -------------------
async function getTranslation(word) {
    // сначала проверяем локальный кеш
    if (window.translationsCache && window.translationsCache[word]) return window.translationsCache[word];
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|ru`;
    try {
        const resp = await fetch(url);
        const data = await resp.json();
        let trans = data?.responseData?.translatedText || word;
        if (trans === word) trans = "???"; 
        if (!window.translationsCache) window.translationsCache = {};
        window.translationsCache[word] = trans;
        return trans;
    } catch(e) { return "???"; }
}

async function getExample(word) {
    // Пытаемся получить пример через Reverso Context (бесплатный public endpoint, работает для личного использования)
    // Используем CORS-прокси, чтобы обойти ограничения браузера (можно и без, но с прокси надёжнее)
    const url = `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://context.reverso.net/translation/english-russian/${word}`)}`;
    try {
        const resp = await fetch(url);
        const html = await resp.text();
        // Парсим примеры: они обычно в <div class="src ltr"> ... </div>
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const examples = doc.querySelectorAll('.src.ltr');
        if (examples.length > 0) {
            let text = examples[0].innerText.trim();
            text = text.replace(/\[.*?\]/g, '').replace(/\s+/g, ' ').substring(0, 200);
            if (text) return text;
        }
        return `Пример для слова "${word}" не найден. Попробуйте другое слово.`;
    } catch(e) {
        return `Пример отсутствует. Вы можете сами придумать предложение со словом "${word}".`;
    }
}

// ------------------- ОСНОВНАЯ ЛОГИКА -------------------
let currentWordObjects = []; // {word, translation, example}

async function enrichWords(wordsArray) {
    // wordsArray - массив строк слов
    const unique = [...new Set(wordsArray.map(w => w.toLowerCase()))];
    const enriched = [];
    for (let w of unique) {
        const translation = await getTranslation(w);
        const example = await getExample(w);
        enriched.push({ word: w, translation: translation, example: example });
    }
    return enriched;
}

async function onWordsReady(rawWords) {
    if (!rawWords.length) { alert('Введите слова'); return; }
    document.getElementById('words-block').style.display = 'block';
    document.getElementById('exercises-area').innerHTML = '<div class="loading">Загрузка переводов и примеров... подождите пару секунд</div>';
    
    // Обогащаем слова переводом и примером
    currentWordObjects = await enrichWords(rawWords);
    renderWordBadges(currentWordObjects.map(o => o.word));
    
    // Настройка select количества
    const countSelect = document.getElementById('word-count-select');
    countSelect.innerHTML = '';
    const maxCount = currentWordObjects.length;
    const counts = [3,5,8,10];
    for(let c of counts) if(c <= maxCount) countSelect.add(new Option(`${c} слов`, c));
    countSelect.add(new Option(`Все (${maxCount})`, 'all'));
    countSelect.value = maxCount >= 5 ? '5' : (maxCount >= 3 ? '3' : 'all');
    
    // Автоматически генерируем упражнения, но лучше по кнопке
}

function renderWordBadges(wordsArr) {
    const container = document.getElementById('display-word-badges');
    container.innerHTML = wordsArr.map(w => `<span class="word-badge">${w}</span>`).join('');
}

async function generateExercises(limit) {
    let selected = [...currentWordObjects];
    if (limit !== 'all') selected = selected.slice(0, parseInt(limit));
    if (selected.length === 0) return;
    const area = document.getElementById('exercises-area');
    area.innerHTML = '';
    
    // ----- 1. Контекстная догадка -----
    let html = `<div class="exercise-card"><div class="exercise-title">🔎 1. Догадайся о значении слова из контекста</div>`;
    selected.forEach((item, idx) => {
        html += `<div class="context-item"><strong>📖 Контекст:</strong> "${item.example}"<br>
        <strong>Слово:</strong> <em>${item.word}</em><br>
        <input type="text" id="guess_${idx}" placeholder="Ваш перевод или значение" style="width: 70%;">
        <button data-word="${item.word}" data-trans="${item.translation}" data-idx="${idx}" class="check-guess-btn">Проверить</button>
        <span id="guess_fb_${idx}"></span></div>`;
    });
    html += `</div><hr>`;
    
    // ----- 2. Соединить пары -----
    html += `<div class="exercise-card"><div class="exercise-title">🔗 2. Соедини слово с переводом</div>
    <div class="match-area"><div class="match-col"><h4>Английские слова</h4><div id="match-english-list"></div></div>
    <div class="match-col"><h4>Переводы</h4><div id="match-trans-list"></div></div></div>
    <div id="match-feedback"></div><button id="check-matches">Проверить пары</button></div><hr>`;
    
    // ----- 3. Ручной перевод -----
    html += `<div class="exercise-card"><div class="exercise-title">✍️ 3. Напиши перевод</div>`;
    selected.forEach((item, idx) => {
        html += `<div class="trans-item"><strong>${item.word}</strong> → <input type="text" id="trans_${idx}" placeholder="Перевод">
        <button data-word="${item.word}" data-trans="${item.translation}" data-idx="${idx}" class="check-trans-btn">Проверить</button>
        <span id="trans_fb_${idx}"></span></div>`;
    });
    html += `</div><hr>`;
    
    // ----- 4. Вставка слова -----
    html += `<div class="exercise-card"><div class="exercise-title">📝 4. Вставь подходящее слово в предложение</div>`;
    selected.forEach((item, idx) => {
        let sentence = item.example;
        if (!sentence || sentence.includes("не найден") || sentence.includes("отсутствует")) {
            sentence = `Придумайте предложение со словом "${item.word}".`;
        }
        const clozeSent = sentence.replace(new RegExp(`\\b${item.word}\\b`, 'i'), '_________');
        const options = [item.word];
        const otherWords = selected.filter(o => o.word !== item.word).map(o => o.word);
        const randomOthers = otherWords.sort(() => 0.5 - Math.random()).slice(0,2);
        options.push(...randomOthers);
        const shuffled = options.sort(() => Math.random() - 0.5);
        let selectHtml = `<select id="cloze_select_${idx}">${shuffled.map(opt => `<option value="${opt}">${opt}</option>`).join('')}</select>`;
        html += `<div class="cloze-item">${clozeSent}<br>Выбери слово: ${selectHtml}
        <button data-correct="${item.word}" data-idx="${idx}" class="check-cloze">Проверить</button>
        <span id="cloze_fb_${idx}"></span></div>`;
    });
    html += `</div>`;
    area.innerHTML = html;
    
    // Обработчики
    document.querySelectorAll('.check-guess-btn').forEach(btn => {
        btn.onclick = () => {
            const idx = btn.getAttribute('data-idx');
            const correctTrans = btn.getAttribute('data-trans');
            const user = document.getElementById(`guess_${idx}`).value.trim().toLowerCase();
            const fb = document.getElementById(`guess_fb_${idx}`);
            if (user === correctTrans.toLowerCase() || (user.length>2 && correctTrans.toLowerCase().includes(user)) || (user.includes(correctTrans.toLowerCase()))) {
                fb.innerHTML = '✅ Верно!'; fb.style.color = 'green';
            } else {
                fb.innerHTML = `❌ Неверно. Правильный перевод: "${correctTrans}"`; fb.style.color = 'red';
            }
        };
    });
    document.querySelectorAll('.check-trans-btn').forEach(btn => {
        btn.onclick = () => {
            const idx = btn.getAttribute('data-idx');
            const correct = btn.getAttribute('data-trans');
            const user = document.getElementById(`trans_${idx}`).value.trim().toLowerCase();
            const fb = document.getElementById(`trans_fb_${idx}`);
            if (user === correct.toLowerCase()) fb.innerHTML = '✅ Отлично!';
            else fb.innerHTML = `❌ Ошибка: правильный перевод "${correct}"`;
        };
    });
    document.querySelectorAll('.check-cloze').forEach(btn => {
        btn.onclick = () => {
            const idx = btn.getAttribute('data-idx');
            const correct = btn.getAttribute('data-correct');
            const selectedVal = document.getElementById(`cloze_select_${idx}`).value;
            const fb = document.getElementById(`cloze_fb_${idx}`);
            if (selectedVal === correct) fb.innerHTML = '✅ Правильно!';
            else fb.innerHTML = `❌ Неправильно. Правильное слово: "${correct}"`;
        };
    });
    
    // Упражнение 2 (соединение пар) - динамическое создание
    const engDiv = document.getElementById('match-english-list');
    const transDiv = document.getElementById('match-trans-list');
    if (engDiv && transDiv) {
        const engWords = selected.map(s => s.word);
        const transWords = selected.map(s => s.translation);
        const shuffledTrans = [...transWords].sort(() => Math.random() - 0.5);
        engDiv.innerHTML = ''; transDiv.innerHTML = '';
        engWords.forEach((w, i) => {
            const div = document.createElement('div'); div.className = 'match-word'; div.textContent = w;
            div.setAttribute('data-eng', w);
            div.setAttribute('data-trans', transWords[i]);
            div.onclick = () => {
                document.querySelectorAll('#match-english-list .match-word').forEach(el => el.classList.remove('selected'));
                div.classList.add('selected');
                window.selectedEnglish = { word: w, translation: transWords[i] };
            };
            engDiv.appendChild(div);
        });
        shuffledTrans.forEach(t => {
            const div = document.createElement('div'); div.className = 'match-word'; div.textContent = t;
            div.onclick = () => {
                if (!window.selectedEnglish) { document.getElementById('match-feedback').innerHTML = 'Сначала выберите английское слово'; return; }
                if (t === window.selectedEnglish.translation) {
                    document.getElementById('match-feedback').innerHTML = `<span class="feedback-good">✓ Верно! (${window.selectedEnglish.word} → ${t})</span>`;
                    div.style.opacity = '0.5'; div.style.pointerEvents = 'none';
                    const engSel = [...document.querySelectorAll('#match-english-list .match-word')].find(el => el.textContent === window.selectedEnglish.word);
                    if(engSel) { engSel.style.opacity = '0.5'; engSel.style.pointerEvents = 'none'; }
                    window.selectedEnglish = null;
                } else {
                    document.getElementById('match-feedback').innerHTML = `<span class="feedback-bad">✗ Неверно: "${window.selectedEnglish.word}" — это "${window.selectedEnglish.translation}", а вы выбрали "${t}"</span>`;
                }
            };
            transDiv.appendChild(div);
        });
    }
    document.getElementById('check-matches')?.addEventListener('click', () => {
        document.getElementById('match-feedback').innerHTML += '<br>Проверка выполнена. Соединяйте пары кликом.';
    });
}

// События
document.getElementById('use-manual-btn')?.addEventListener('click', async () => {
    let raw = document.getElementById('custom-words-list').value;
    let words = raw.split(/[ ,\n]+/).filter(w => w.trim().length > 0);
    if (words.length === 0) { alert('Введите слова'); return; }
    await onWordsReady(words);
});
document.getElementById('extract-words-btn')?.addEventListener('click', async () => {
    // Упрощённо: из текста берём все слова (без фильтра по уровню, т.к. уровень требует словаря)
    const text = document.getElementById('source-text').value;
    if (!text.trim()) { alert('Вставьте текст'); return; }
    const words = text.toLowerCase().match(/\b[a-z]{3,}\b/g) || [];
    const unique = [...new Set(words)];
    await onWordsReady(unique);
});
document.getElementById('confirm-count-btn')?.addEventListener('click', () => {
    const limit = document.getElementById('word-count-select').value;
    generateExercises(limit);
});
// Переключение вкладок
document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const mode = btn.getAttribute('data-mode');
        document.getElementById('panel-manual').classList.toggle('active', mode === 'manual');
        document.getElementById('panel-text').classList.toggle('active', mode === 'text');
        document.getElementById('words-block').style.display = 'none';
        document.getElementById('exercises-area').innerHTML = '';
    });
});
</script>
</body>
</html>
